apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopeasy-api
  namespace: shopeasy
  labels:
    app: shopeasy-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopeasy-api
  template:
    metadata:
      labels:
        app: shopeasy-api
    spec:
      serviceAccountName: shopeasy-api
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: AWS_REGION
              value: "ap-northeast-2"
            # DB 설정 — RDS MySQL 사용
            - name: DB_TYPE
              value: "mysql"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: shopeasy-app-secrets
                  key: DB_HOST
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopeasy-app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopeasy-app-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              value: "shopeasy"
            # 스토리지 설정 — S3 사용
            - name: STORAGE_TYPE
              value: "s3"
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: shopeasy-app-secrets
                  key: S3_BUCKET
            - name: S3_REGION
              value: "ap-northeast-2"
            # 리뷰 저장소 — DynamoDB 사용
            - name: REVIEW_STORE
              value: "dynamodb"
            - name: DYNAMODB_TABLE
              valueFrom:
                secretKeyRef:
                  name: shopeasy-app-secrets
                  key: DYNAMODB_TABLE
            - name: DYNAMODB_REGION
              value: "ap-northeast-2"
            # 인증
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopeasy-app-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
      nodeSelector:
        workload: api
